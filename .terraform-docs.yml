# Terraform documentation configuration

formatter: "markdown table"

version: ""

header-from: main.tf
footer-from: ""

recursive:
  enabled: false

sections:
  hide: []
  show: []

content: |-
  # Datadog Tag Compliance Demo - Terraform Resources
  
  This Terraform configuration demonstrates both compliant and non-compliant resources for Datadog tagging requirements.
  
  ## Required Datadog Tags
  
  All resources must include these tags for optimal Datadog observability:
  
  - `env`: Environment (prod, staging, dev, test)  
  - `service`: Service name (lowercase-with-hyphens)
  - `version`: Version (semantic versioning or branch name)
  - `team`: Owning team (lowercase-with-hyphens)
  
  ## Datadog Benefits
  
  These tags enable:
  - 🎯 Seamless navigation in Datadog UI
  - 🤖 Enhanced Watchdog anomaly detection
  - 🔍 Better APM service mapping and traces
  - 📊 Improved log correlation and filtering
  - 📱 Effective RUM performance monitoring
  - ☸️ Complete Kubernetes observability
  
  {{ .Requirements }}
  
  {{ .Providers }}
  
  {{ .Modules }}
  
  {{ .Resources }}
  
  {{ .Inputs }}
  
  {{ .Outputs }}

output:
  file: "README.md"
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

output-values:
  enabled: false
  from: ""

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
